# The product is always a Windows PE (see Cargo.toml), so make that the default
# target. Without this, cargo and rust-analyzer build for the host, every
# #[cfg(windows)] block evaluates false, and the whole program greys out.
[build]
target = "x86_64-pc-windows-gnu"

# No `runner` here on purpose. A runner is configured per target, not per host,
# so one set here would also fire on Windows - where the freshly built .exe
# needs no help and cargo cannot execute a shell script (os error 193). Linux
# needs the exe launched inside the game's Proton container, so there
# `scripts/run.sh` injects the runner for the length of one cargo invocation.
